name: Deploy API → Azure App Service

# Secrets necesarios en GitHub → Settings → Secrets and variables → Actions:
#   AZURE_CREDENTIALS    — JSON del service principal (az ad sp create-for-rbac --json-auth)
#   AZURE_WEBAPP_NAME    — nombre del App Service (ej: cafeies-api)

on:
  push:
    branches: [main]
    paths:
      - 'CafeIES.API/**'
      - 'CafeIES.Shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.x'
  PROJECT_PATH:   'CafeIES.API/CafeIES.API.csproj'
  PUBLISH_DIR:    'publish/api'
  RESOURCE_GROUP: 'cafeies-rg'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build & Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_DIR }} --no-restore

      - name: Zip publish output
        run: |
          cd ${{ env.PUBLISH_DIR }}
          zip -r ../app.zip .
          echo "ZIP size: $(du -sh ../app.zip)"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --src-path publish/app.zip \
            --type zip \
            --async false

      # Las claves de Stripe se gestionan directamente en Azure Portal →
      # App Service → Configuración → Stripe__SecretKey / Stripe__PublishableKey
