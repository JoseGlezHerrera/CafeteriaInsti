name: Deploy Android → GitHub Releases

# Distribuye la app como APK de debug adjunto a un GitHub Release.
# No requiere cuenta Google Play Developer ni keystore de firma.
# Los testers descargan el APK e instalan manualmente (fuentes desconocidas).
#
# Cuando se disponga de cuenta Google Play Developer, usar el workflow
# deploy-android-play.yml (renombrar este o crear uno nuevo con firma release).

on:
  push:
    branches: [main]
    paths:
      - 'CafeIES.MAUI/**'
      - 'CafeIES.Shared/**'
      - '.github/workflows/deploy-android.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nombre de versión visible (ej: 1.1.0)'
        required: false
        default: ''

env:
  DOTNET_VERSION:              '9.x'
  PROJECT_PATH:                'CafeIES.MAUI/CafeIES.MAUI.csproj'
  DOTNET_NOLOGO:               'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necesario para crear GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # El runner tiene .NET 10 preinstalado. Forzar SDK 9.x antes de
      # instalar el workload para que ambos usen la misma versión.
      - name: Fijar SDK 9.x (global.json)
        run: |
          echo '{"sdk":{"version":"9.0.0","rollForward":"latestFeature"}}' > global.json
          dotnet --version

      - name: Instalar workload maui-android
        run: dotnet workload install maui-android --skip-sign-check

      - name: Restore
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} -p:TargetFramework=net9.0-android
          dotnet restore CafeIES.Shared/CafeIES.Shared.csproj

      - name: Calcular versionCode y versionName
        id: version
        run: |
          VERSION_CODE=$(( 1000 + ${{ github.run_number }} ))
          VERSION_NAME="${{ inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="$(date +'%Y.%m').${{ github.run_number }}"
          fi
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VersionCode: $VERSION_CODE  VersionName: $VERSION_NAME"

      - name: Build APK (debug)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -f net9.0-android \
            -p:TargetFrameworks=net9.0-android \
            --no-restore \
            -c Debug \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSupportedAbis="armeabi-v7a;arm64-v8a" \
            -p:ApplicationVersion=${{ steps.version.outputs.code }} \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.name }}

      - name: Localizar APK generado
        run: |
          APK=$(find CafeIES.MAUI/bin/Debug/net9.0-android -name '*.apk' | grep -v 'Signed' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find CafeIES.MAUI/bin/Debug/net9.0-android -name '*.apk' | head -1)
          fi
          if [ -z "$APK" ]; then echo "ERROR: APK no encontrado" && exit 1; fi
          echo "APK: $APK  ($(du -sh "$APK" | cut -f1))"
          # Renombrar con version para el release
          DEST="cafeies-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_ENV

      - name: Crear GitHub Release y subir APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: CaféIES v${{ steps.version.outputs.name }}
          body: |
            ## CaféIES v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})

            ### Instalación
            1. Descarga `cafeies-${{ steps.version.outputs.name }}.apk`
            2. En el móvil: **Ajustes → Seguridad → Instalar apps desconocidas** → activar para el navegador/gestor de archivos
            3. Abre el APK descargado e instala

            > ⚠️ Build de prueba interna — no apto para producción.
          files: ${{ env.apk_path }}
          draft: false
          prerelease: true
