name: Deploy Admin → Azure Static Web Apps

# Secrets necesarios en GitHub → Settings → Secrets and variables → Actions:
#   AZURE_STATIC_WEB_APPS_API_TOKEN — token de la Static Web App (Azure Portal → Overview → Manage deployment token)
#   API_BASE_URL                    — URL pública de la API (ej: https://cafeies-api.azurewebsites.net/)

on:
  push:
    branches: [main]
    paths:
      - 'CafeIES.Admin/**'
      - 'CafeIES.Shared/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.x'
  PROJECT_PATH:   'CafeIES.Admin/CafeIES.Admin.csproj'
  PUBLISH_DIR:    'publish/admin'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Inyectar URL de la API en appsettings.json
        run: |
          echo '{"ApiBaseUrl":"${{ secrets.API_BASE_URL }}"}' \
            > CafeIES.Admin/wwwroot/appsettings.json

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build & Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_DIR }} --no-restore

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token:                      ${{ secrets.GITHUB_TOKEN }}
          action:                          'upload'
          app_location:                    '${{ env.PUBLISH_DIR }}/wwwroot'
          skip_app_build:                  true
