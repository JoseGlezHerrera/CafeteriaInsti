# ==============================================================================
# CaféIES — Reglas ProGuard / R8 para Android Release
# ==============================================================================
# El linker de .NET MAUI gestiona el árbol de ensamblados .NET.
# Estas reglas protegen las clases Java/Kotlin del runtime y las librerías nativas.

# ── Mono / .NET MAUI runtime ──────────────────────────────────────────────────
-keep class mono.**                        { *; }
-keep class crc64**.**                     { *; }
-keep class com.microsoft.maui.**          { *; }
-keep class com.xamarin.**                 { *; }
-dontwarn mono.**
-dontwarn crc64**.**

# ── Firebase Cloud Messaging ──────────────────────────────────────────────────
-keep class com.google.firebase.**         { *; }
-keep class com.google.android.gms.**      { *; }
-dontwarn com.google.firebase.**
-dontwarn com.google.android.gms.**

# ── SignalR / WebSockets (OkHttp + OkIO) ─────────────────────────────────────
-dontwarn okhttp3.**
-dontwarn okio.**
-dontwarn javax.annotation.**
-keep class okhttp3.**  { *; }
-keep class okio.**     { *; }

# ── Stripe Android SDK (si se añade en el futuro) ─────────────────────────────
-dontwarn com.stripe.**
-keep class com.stripe.** { *; }

# ── Enumeraciones y serialización ────────────────────────────────────────────
# Evita que R8 renombre las enumeraciones usadas en JSON/reflexión
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# ── Modelos con Parcelable (por si alguna librería los usa) ───────────────────
-keepclassmembers class * implements android.os.Parcelable {
    public static final android.os.Parcelable$Creator *;
}

# ── Suprimir avisos inofensivos ───────────────────────────────────────────────
-dontwarn java.lang.invoke.**
-dontwarn **$$serializer
-dontwarn kotlinx.**
