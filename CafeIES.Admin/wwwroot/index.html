<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CaféIES Admin</title>
    <base href="/"/>
    <link rel="stylesheet" href="css/app.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f0e0c;color:#f2ede6;font-family:sans-serif">
            Cargando CaféIES Admin...
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Descarga un archivo desde bytes en el navegador (usado por Reportes.razor)
        window.cafeiesDownload = function (filename, contentType, data) {
            const blob = new Blob([new Uint8Array(data)], { type: contentType });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
